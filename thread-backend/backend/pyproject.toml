[project]
name = "thread-backend"
version = "1.0.0"
description = "The Thread backend: recognises faces locally, files conversations, answers questions about who you have met."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "openai>=3.57.0",
    "opencv-python-headless>=4.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
